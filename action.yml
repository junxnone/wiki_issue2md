# https://www.freecodecamp.org/news/publishing-github-event-data-with-github-actions-and-pages/
# https://stackoverflow.com/questions/58597010/how-to-access-a-github-issue-comment-body-using-github-actions
# This is a basic workflow to help you get started with Actions
# https://github.com/maguowei/iaas/blob/d48834c18b66ae0f3ae32e5e62a6811dfddadcb2/.github/workflows/iaas.yml
# replace invalid characters in filename https://stackoverflow.com/a/50876753/1553656

name: issue2post
description: "Turn issues into markdown file"
branding:
  icon: "archive"
  color: "green"
inputs:
  branch:
    description: "Target branch name to push the markdownfile"
    required: true
    default: "master"
  dir:
    description: "the posts dir"
    required: true
    default: "_posts"
  GITHUB_TOKEN:
    description: "secrets.GITHUB_TOKEN"
    required: true
  created_at:
    description: "github.event.issue.created_at"
    required: true
  updated_at:
    description: "github.event.issue.updated_at"
    required: true
  label_name:
    description: "github.event.issue.label[name]"
    required: true
  title:
    description: "github.event.issue.title"
    required: true
  body:
    description: "github.event.issue.body"
    required: true
  number:
    description: "github.event.issue.bumber"
    required: true
  actor:
    description: "github.actor"
    required: true
  nohead:
    description: "no create/update/..."
    required: true
runs:
  using: "composite"
  steps:
    - id: generate-markdown-file
      name: Turn comment into file
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
        CREATED_AT: ${{ inputs.created_at }}
        UPDATED_AT: ${{ inputs.updated_at }}
        LABEL_NAME: ${{ inputs.label_name }}
        NUMBER: ${{ inputs.number }}
        NOHEAD: ${{ inputs.nohead }}
        REPOSITORY: ${{ github.repository }}
      run: |
        mkdir -p "$DIR"
        POST_TITLE=$(sed -E 's/[[:space:]|[:punct:]]/_/g' <<< "$TITLE")
        if [ "$TITLE" == "sidebar" ]; then
          if [ -f "$DIR/${POST_TITLE}.md" ]; then ACTION=update; else ACTION=new; fi
          printf '%s\n' "$BODY" > "$DIR/${POST_TITLE}.md"
        elif [ "$NOHEAD" == "true" ]; then
          ISSUE4NUMBER=$(printf '%04d' "$NUMBER")
          if ls "$DIR"/${ISSUE4NUMBER}_*.md &> /dev/null; then
            ACTION=update
            rm -f "$DIR"/${ISSUE4NUMBER}_*
          else
            ACTION=new
          fi
          POST_TITLE="${ISSUE4NUMBER}_$(sed -E 's/[[:space:]|[:punct:]]/_/g' <<< "$TITLE")"
          printf '%s\n' "$BODY" > "$DIR/${POST_TITLE}.md"
        elif [ "$TITLE" == "README" ]; then
          if [ -f "$DIR/${POST_TITLE}.md" ]; then ACTION=update; else ACTION=new; fi
          {
            printf '%s\n' "---"
            printf 'Title | %s\n' "$TITLE"
            printf -- '-- | --\n'
            printf 'Updated @ | `%s`\n' "$UPDATED_AT"
            printf 'Edit @ | [here](https://github.com/%s/issues/%s)\n' "$REPOSITORY" "$NUMBER"
            printf '\n---\n'
            printf '%s\n' "$BODY"
          } > "$DIR/${POST_TITLE}.md"
        else
          ISSUE4NUMBER=$(printf '%04d' "$NUMBER")
          if ls "$DIR"/${ISSUE4NUMBER}_*.md &> /dev/null; then
            ACTION=update
            rm -f "$DIR"/${ISSUE4NUMBER}_*
          else
            ACTION=new
          fi
          POST_TITLE="${ISSUE4NUMBER}_$(sed -E 's/[[:space:]|[:punct:]]/_/g' <<< "$TITLE")"
          {
            printf '%s\n' "---"
            printf 'Title | %s\n' "$TITLE"
            printf -- '-- | --\n'
            printf 'Created @ | `%s`\n' "$CREATED_AT"
            printf 'Updated @| `%s`\n' "$UPDATED_AT"
            printf 'Labels | `%s`\n' "$LABEL_NAME"
            printf 'Edit @| [here](https://github.com/%s/issues/%s)\n' "$REPOSITORY" "$NUMBER"
            printf '\n---\n'
            printf '%s\n' "$BODY"
          } > "$DIR/${POST_TITLE}.md"
        fi
        mkdir -p "$DIR/bk/media"
        DELIM="EOF_${RANDOM}_${RANDOM}"
        {
          echo "doc_title=${POST_TITLE}"
          echo "doc_action=${ACTION}"
          echo "doc_display_title<<${DELIM}"
          printf '%s\n' "$TITLE"
          echo "${DELIM}"
        } >> "$GITHUB_ENV"
        mkdir -p media
        echo "# converted by pandoc" > media/README.md
    - uses: docker://pandoc/latex:2.9
      with:
        args: -f gfm "${{ inputs.dir }}/${{ env.doc_title }}".md -o "${{ inputs.dir }}/bk/${{ env.doc_title }}".md --extract-media=media -w gfm
    - name: Push changes to repo
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
        BRANCH: ${{ inputs.branch }}
        ACTOR: ${{ inputs.actor }}
        TOKEN: ${{ inputs.GITHUB_TOKEN }}
        REPOSITORY: ${{ github.repository }}
        ACTION: ${{ env.doc_action }}
        DISPLAY_TITLE: ${{ env.doc_display_title }}
      run: |
        cp media/* "$DIR/bk/media/"
        REMOTE="https://${TOKEN}@github.com/${REPOSITORY}"
        git config user.email "${ACTOR}@users.noreply.github.com"
        git config user.name "$ACTOR"
        if [ "$ACTION" == "update" ]; then
          COMMIT_MSG="更新了 ${DISPLAY_TITLE}"
        else
          COMMIT_MSG="新增了 ${DISPLAY_TITLE}"
        fi
        # stash the generated/modified files (new + tracked) before switching branches, so none of it is lost
        HAS_CHANGES=$(git status --porcelain)
        if [ -n "$HAS_CHANGES" ]; then
          git stash push --include-untracked -m "issue2post changes"
        fi
        for i in 1 2 3 4 5; do
          git fetch "$REMOTE" "$BRANCH"
          git checkout -B "$BRANCH" FETCH_HEAD
          if [ -n "$HAS_CHANGES" ] && ! git stash apply; then
            # this run's generated content is authoritative for its own output files; let it win any conflict
            CONFLICTED=$(git diff --name-only --diff-filter=U)
            if [ -n "$CONFLICTED" ]; then
              git checkout --ours -- $CONFLICTED
              git add -- $CONFLICTED
            fi
          fi
          git add "$DIR"
          git status
          # a rerun with identical content leaves nothing to commit, which is not a failure
          if ! git commit -m "$COMMIT_MSG"; then
            echo "nothing to commit"
            git stash drop 2>/dev/null || true
            exit 0
          fi
          if git push "$REMOTE" "$BRANCH"; then
            git stash drop 2>/dev/null || true
            exit 0
          fi
          echo "push rejected (attempt $i), retrying after fresh fetch..."
          sleep $((i * 3))
        done
        echo "::error::push to $BRANCH failed after retries"
        exit 1
